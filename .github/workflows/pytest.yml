name: Pytest

on:
  push:
    branches: [main]
    paths:
      - "**.py"
      - "tests/**"
      - "gen_fleet.sh"
      - "tools/**"
      - "consumer/**"
      - ".github/workflows/pytest.yml"
  pull_request:
    paths:
      - "**.py"
      - "tests/**"
      - "gen_fleet.sh"
      - "tools/**"
      - "consumer/**"
      - ".github/workflows/pytest.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          # ROS messages / FastAPI are stubbed or unused by the unit suite.
          pip install pytest

      - name: Run unit tests
        run: pytest -q
