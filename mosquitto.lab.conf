# Shared-broker (bridge network): Docker publishes 127.0.0.1:1883→1883.
# Per-robot (host network): gen_fleet.sh rewrites to "listener <port> 127.0.0.1".
listener 1883
# Anonymous is OK only because host ports / host-network listeners are loopback-bound.
allow_anonymous true
max_inflight_messages 65535
max_queued_messages 100000
log_type warning
set_tcp_nodelay true
