services:
  jobmanager:
      image: flink:1.9.1
      ports:
        - "8082:8081" 
      volumes:
        - ./GIS4IoRT-geoflink/deployments/geoflink/docker/data:/data
      command: jobmanager
      environment:
        - |
          FLINK_PROPERTIES=
          jobmanager.rpc.address: jobmanager        

  taskmanager:
    image: flink:1.9.1
    depends_on:
      - jobmanager
    volumes:
      - ./GIS4IoRT-geoflink/deployments/geoflink/docker/data:/data
    command: taskmanager
    scale: 3
    # PARAMETERIZE NUMBER OF SLOTS
    environment:
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: jobmanager
        taskmanager.numberOfTaskSlots: 2    

  jar-uploader:
    image: curlimages/curl:8.18.0
    container_name: jar-uploader
    depends_on:
      - jobmanager
    volumes:
      - ./GIS4IoRT-geoflink/deployments/geoflink/docker/jars:/jars  
    command: >
      /bin/sh -c "
        echo 'Waiting for Flink JobManager...';
        while ! curl -s http://jobmanager:8081/overview > /dev/null; do sleep 3; done;
        echo 'JobManager available. Sending jar files...';
        for file in /jars/*.jar; do
          if [ -f \"\$$file\" ]; then
            curl -X POST -H \"Expect:\" -F \"jarfile=@\$$file\" http://jobmanager:8081/jars/upload;
          fi
        done;
        echo 'All jar files sent';
      "

  kafka-ui:
      image: provectuslabs/kafka-ui:v0.7.2
      hostname: kafka-ui
      ports:
        - "8090:8080"
      environment:
        KAFKA_CLUSTERS_0_NAME: fleet
        KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: broker:29092 


  gis-api:
    build:
      context: ./GIS4IoRT-geoflink
      dockerfile: deployments/geoflink/docker/api/Dockerfile.api
    hostname: gis-api
    depends_on:
      jobmanager:
        condition: service_started
      jar-uploader:  
        condition: service_completed_successfully
    ports:
      - "8000:8000"
    environment:
      ACTIVE_ADAPTER: geoflink
      FLINK_URL: http://jobmanager:8081
      KAFKA_BOOTSTRAP_SERVERS: broker:29092
      FLINK_JAR_NAME: GeoFlinkProject-0.1
      GEOFLINK_DB_NAME: geoflink_registry.db
    volumes:
      - ./GIS4IoRT-geoflink/app:/code/app
      - ./GIS4IoRT-geoflink/deployments/geoflink/docker/data:/data
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload